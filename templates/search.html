<!DOCTYPE html>
<html lang="en" class="pico-background-pink-150">
<head class="pico-background-pink-150">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{query}} - Mewgle Search</title>
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css"
>
<link rel="icon" href={{url_for("static", filename="icon.png")}}>
</head>
<body>
  <main class="container pico-background-pink-150">
    <a href="/">
      <img src={{url_for('static', filename='logo.png')}} alt="Homepage" style="padding: 20px 0px;">
    </a>
    <form method="post" action="{{url_for('search')}}">
      <input type="search", name="textbox", class="pico-background-purple-50", title="Search Cats">
    </form>
    {% if cats|length == 0 %}
      <p>Search did not return any results.</p>
    {% endif %}
    {% for cat in cats %}
        <article class="pico-background-pink-250">
          <header class="pico-background-pink-250"><a href="/cat/{{cat.name}}">{{cat.nameflag}}</a></header>
        {% if cat.description is defined %}
            <p>{{cat.description}}</p>
        {% endif %}
        </article>
    {% endfor %}
  </main>
</body>
</html>
